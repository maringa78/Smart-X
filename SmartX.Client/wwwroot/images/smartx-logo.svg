<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <style>
      .logo-smart-text { fill: #0f172a; }
      .logo-dash-text { fill: #38bdf8; }
      .logo-x-text { fill: #2563eb; }
      :root[data-theme="dark"] .logo-smart-text { fill: #ffffff; }
      :root[data-theme="dark"] .logo-dash-text { fill: #38bdf8; }
      :root[data-theme="dark"] .logo-x-text { fill: #60a5fa; }
    </style>
  </defs>

  <!-- Network Sphere Mark (based on Smart-X Gateway sphere logo) -->
  <g transform="translate(10, 8)">
    <!-- Connecting network lines -->
    <g stroke="#3b82f6" stroke-width="1.2" opacity="0.85" stroke-linecap="round">
      <line x1="16" y1="20" x2="28" y2="10" />
      <line x1="28" y1="10" x2="42" y2="14" />
      <line x1="42" y1="14" x2="52" y2="24" />
      <line x1="16" y1="20" x2="24" y2="32" />
      <line x1="28" y1="10" x2="36" y2="24" />
      <line x1="42" y1="14" x2="36" y2="24" />
      <line x1="36" y1="24" x2="48" y2="34" />
      <line x1="52" y1="24" x2="48" y2="34" />
      
      <line x1="16" y1="20" x2="14" y2="36" />
      <line x1="24" y1="32" x2="20" y2="46" />
      <line x1="24" y1="32" x2="34" y2="40" />
      <line x1="36" y1="24" x2="34" y2="40" />
      <line x1="48" y1="34" x2="34" y2="40" />
      <line x1="48" y1="34" x2="46" y2="50" />
      
      <line x1="14" y1="36" x2="20" y2="46" />
      <line x1="20" y1="46" x2="32" y2="56" />
      <line x1="34" y1="40" x2="32" y2="56" />
      <line x1="34" y1="40" x2="46" y2="50" />
      <line x1="32" y1="56" x2="44" y2="58" />
      <line x1="46" y1="50" x2="44" y2="58" />

      <!-- Dispersion / burst lines on right -->
      <line x1="52" y1="24" x2="60" y2="20" />
      <line x1="48" y1="34" x2="58" y2="32" />
      <line x1="58" y1="32" x2="63" y2="26" />
      <line x1="48" y1="34" x2="60" y2="42" />
      <line x1="46" y1="50" x2="56" y2="52" />
      <line x1="60" y1="42" x2="64" y2="46" />
    </g>

    <!-- Dispersion particles on right -->
    <circle cx="62" cy="18" r="1.3" fill="#60a5fa" />
    <circle cx="60" cy="20" r="1.8" fill="#38bdf8" />
    <circle cx="65" cy="23" r="1.2" fill="#93c5fd" />
    <circle cx="63" cy="26" r="1.8" fill="#38bdf8" />
    <circle cx="66" cy="30" r="1.2" fill="#60a5fa" />
    <circle cx="58" cy="32" r="2.2" fill="#0ea5e9" />
    <circle cx="65" cy="36" r="1.4" fill="#38bdf8" />
    <circle cx="60" cy="42" r="2" fill="#0ea5e9" />
    <circle cx="64" cy="46" r="1.5" fill="#60a5fa" />
    <circle cx="56" cy="52" r="1.8" fill="#38bdf8" />

    <!-- Core nodes -->
    <circle cx="16" cy="20" r="2.8" fill="#38bdf8" />
    <circle cx="28" cy="10" r="2.4" fill="#60a5fa" />
    <circle cx="42" cy="14" r="2.6" fill="#38bdf8" />
    <circle cx="52" cy="24" r="2.2" fill="#60a5fa" />
    <circle cx="24" cy="32" r="4.2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="36" cy="24" r="3.2" fill="#38bdf8" />
    <circle cx="48" cy="34" r="3.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="36" r="2.6" fill="#60a5fa" />
    <circle cx="20" cy="46" r="2.4" fill="#38bdf8" />
    <circle cx="34" cy="40" r="3.8" fill="#38bdf8" />
    <circle cx="46" cy="50" r="2.6" fill="#60a5fa" />
    <circle cx="32" cy="56" r="2.4" fill="#38bdf8" />
    <circle cx="44" cy="58" r="2.2" fill="#60a5fa" />
  </g>

  <!-- Typography -->
  <text x="82" y="41" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" letter-spacing="1">
    <tspan class="logo-smart-text">SMART</tspan>
    <tspan class="logo-dash-text">-</tspan>
    <tspan class="logo-x-text">X</tspan>
  </text>
  
  <text x="83" y="58" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5" fill="#38bdf8">
    GATEWAY
  </text>
</svg>
